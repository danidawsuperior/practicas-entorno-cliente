<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>entrada Usuario</title>
</head>
<body>
    <h3>Usuario: <input type="text"></h3>
    <div id="obtener-tiempo-de-ausencia">
    </div>

    <script>
        let contenedor = document.getElementById("obtener-tiempo-de-ausencia");

        let mes = Math.floor(Math.random() * (12-1) + 1);
        let dia = Math.floor(Math.random() * (30-1) + 1);
        let horas = Math.floor(Math.random() * (24 - 1) + 1);

        contenedor.innerHTML = "Hace " + mes + " meses, " + dia + " dias, y " + horas + " horas";

    </script>
</body>
</html>
