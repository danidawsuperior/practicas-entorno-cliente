<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>entrada Usuario</title>
</head>

<body>
    <h3>Usuario: <input type="text"></h3>
    <input type="button" value="Validar" onclick="verTiempo()">
    <div id="obtener-tiempo-de-ausencia">
    </div>

    <script>
        let nomUsuario = document.getElementsByTagName('input')[0];
        let contenedor = document.getElementById("obtener-tiempo-de-ausencia");
        function verTiempo() {
            let mes = Math.floor(Math.random() * (4 - 1) + 1);
            let dia = Math.floor(Math.random() * (30 - 1) + 1);
            let horas = Math.floor(Math.random() * (24 - 1) + 1);

            if(nomUsuario.value != ""){
                contenedor.innerHTML = "Buenas " + nomUsuario.value + " <br> Hace " + mes + " meses, " + dia + " dias, y " + horas + " horas que no te conectas";
            } else {
                contenedor.innerHTML = "Error, el campo de usuario tiene que estar relleno"
            }

            
        }
    </script>
</body>

</html>
