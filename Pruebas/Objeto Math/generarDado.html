<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TirarDado</title>
    <script>
        function LanzarDado(){
            let mostrarMensaje = document.getElementsByTagName("input")[0];
            let minimo = 1;
            let maximo = 6;
            //Si utilizamos Math.round() utilizar
            let dado = Math.round(Math.random()*(maximo - minimo)) + minimo;
            /*
            Tambien se puede poner 
            let dado = Math.floor(Math.random()*((maximo + 1) - minimo)) + minimo;
            let dado = Math.floor(Math.random() * maximo) + minimo;
            */
            mostrarMensaje.value = dado;
        }
    </script>
</head>
<body>
    <h1>Tirar Dado</h1>
    <label for="">Nº Generado: </label><input type="text" id="cuadroTexto" size="1"><br>
    <input type="button" value="Lanzar" onclick="LanzarDado()">
    
</body>
</html>
