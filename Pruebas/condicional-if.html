<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var a = "a";
        var b = "b";
        if (a < b) { // true
            document.write(a + " es menor que " + b);
        } else if (a > b) {
            document.write(a + " es mayor que " + b);
        } else {
            document.write(a + " y " + b + " son iguales.");
        }
        
        var cualquierCadena = "Brave new world"
        document.write("<P>The index of the first w from the beginning is " +
            cualquierCadena.indexOf("w")); // Muestra 8
        document.write("<P>The index of the first w from the end is " +
            cualquierCadena.lastIndexOf("w")); // Muestra 10
        document.write("<P>The index of 'new' from the beginning is " +
            cualquierCadena.indexOf("new")); // Muestra 6
        document.write("<P>The index of 'new' from the end is " +
            cualquierCadena.lastIndexOf("new")); // Muestra 6
    </script>
</head>
