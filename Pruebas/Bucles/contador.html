<html lang="en">
<head>

    <title>Contador</title>
    <script>
        var cuenta = 10;
       /* function decrementar() {

        */
        // Contador que al pulsar un boton decremente y aumente
        function disminuirContador (){
            let contador = 10;
            let mostrarPantalla = document.getElementById("contador");
            let numAcumulado="";
            for(let i=contador; i>=0; i--){
                numAcumulado += i +"\n";
                //document.getElementById("instante").value = i;
            }
            mostrarPantalla.value=numAcumulado;
        }
    </script>
</head>
<body>
    <h1>CONTADOR DECRECIENTE DE NÚMEROS</h1>
    <input type="button" value="Decremento" onclick="disminuirContador()"><br><br>
    <input type="text" id="instante">
    <textarea name="pantallaContador" id="contador" cols="20" rows="12"></textarea>


</body>
